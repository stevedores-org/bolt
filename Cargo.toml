[package]
name = "bolt"
version = "0.1.0"
edition = "2021"
description = "Ray in Rust — a minimal distributed task & actor runtime for the Lornu AI agent fleet"
license = "MIT"
repository = "https://github.com/stevedores-org/bolt"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }

[[example]]
name = "aivcs_swarm"
path = "examples/aivcs_swarm.rs"
